spring.application.name=order_payment_gateway_system

server.port=9981



spring.datasource.url=jdbc:postgresql://localhost:5409/order_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.hibernate.ddl-auto = update

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

#jwt token
spring.private.token=my_super_secret_key_123456_extra_characters_for_security

#logs
logging.level.org.springframework.security=DEBUG
logging.level.refund_return_processing_system.rrps=DEBUG





#1)
#docker run --name my-postgres-order-gateway-ms -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=order_db -p 5409:5432 -d postgres  ---> for running the db container

#2) for entering the DB
#docker exec -it my-postgres-order-gateway-ms psql -U postgres -d order_db
